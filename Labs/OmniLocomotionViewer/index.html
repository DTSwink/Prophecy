<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Omni · NN recordings</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d141e;color:#e3edf9;font:14px system-ui}header{padding:18px 24px;border-bottom:1px solid #293747;display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:21px;margin:0 0 4px}.sub{color:#9cafc5;font-size:12px}button,select{background:#1d2b3c;border:1px solid #40566e;border-radius:7px;color:inherit;padding:9px 13px;cursor:pointer}button:hover{border-color:#71ddd3}button.active{background:#146863}nav{padding:12px 24px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}#clips{max-width:330px}#grid{padding:0 20px 100px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{border:1px solid #2c4054;border-radius:10px;overflow:hidden;background:#14202c}.card header{padding:9px 12px}.card strong{font-size:14px}.card canvas{display:block;width:100%;height:285px;touch-action:none}.card .metrics{padding:6px 12px;font:12px ui-monospace,monospace;color:#97c4d4}.card button{padding:5px 9px}.single{grid-template-columns:1fr!important}.single canvas{height:calc(100vh - 300px);min-height:330px}footer{position:fixed;bottom:0;left:0;right:0;background:#101b29f5;border-top:1px solid #40566e;padding:12px 24px;display:flex;gap:12px;align-items:center}input[type=range]{accent-color:#63d9c9;flex:1;min-width:100px}label{white-space:nowrap;color:#bed0e4}#rangeInfo{margin-left:auto}#error{color:#ff9f8e;padding:12px;white-space:pre-wrap}@media(max-width:1000px){#grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){#grid{grid-template-columns:1fr}header{padding:12px}nav{padding:10px}footer{padding:8px;gap:6px}footer label{display:none}}
</style><header><div><h1>Omni · NN recordings</h1><div class="sub">Unreal walk / run policies · initialized from each source clip · 2 s settle → 3 s capture · best full-stride cuts · no blending</div></div><button id="reload">Reload recordings</button></header><nav><button id="all" class="active">All</button><button id="walk">Walking</button><button id="run">Running</button><select id="clips" aria-label="Choose recording"></select><button id="gridMode">Grid</button><label><input id="bestCuts" type="checkbox" checked> Best cuts</label><label><input id="bicolor" type="checkbox" checked> Limb colors</label><label><input id="skeleton" type="checkbox"> Skeleton</label><button id="resetCamera">Reset camera</button><span id="rangeInfo"></span><button id="prevPage">‹</button><button id="nextPage">›</button></nav><div id="error" hidden></div><section id="grid"></section><footer><button id="play">Pause</button><button id="prevFrame" title="Previous tick">◀</button><button id="nextFrame" title="Next tick">▶</button><input id="timeline" aria-label="Recording time" type="range" min="0" max="180" step="1" value="0"><span id="clock">0.00 / 3.00 s</span><select id="speed" aria-label="Playback speed"><option value=".25">0.25×</option><option value=".5">0.5×</option><option value="1" selected>1×</option></select><label><input id="loop" type="checkbox" checked> Repeat</label></footer><script src="/shared/recovery.js"></script><script src="/shared/renderer.js"></script><script src="/app.js"></script></html>
