<!doctype html><title>Bodyflip checks</title><button id="profile">Profile 60 frames</button><pre id="result">Ready</pre><iframe id="lab" src="/" style="width:1000px;height:700px"></iframe><script>
document.getElementById("profile").onclick=async()=>{const a=lab.contentWindow.BodyflipLab;if(!a){result.textContent='Not ready';return;}a.setPlaying(false);const samples=[];for(let n=0;n<70;n++){const t=performance.now();a.step();if(n>=10)samples.push(performance.now()-t);if(n%10===0)await new Promise(r=>setTimeout(r,0));}samples.sort((a,b)=>a-b);result.textContent=JSON.stringify({meanMs:samples.reduce((a,b)=>a+b)/samples.length,p50:samples[30],p95:samples[57],max:samples[59]},null,2);};
</script>
