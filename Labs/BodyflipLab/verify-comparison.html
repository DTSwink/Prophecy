<!doctype html><title>Bodyflip comparison checks</title><button id="run">Check comparison</button><pre id="result">Ready</pre><iframe id="lab" src="/" style="width:1100px;height:720px"></iframe><script>
document.getElementById('run').onclick=async()=>{
 const w=lab.contentWindow,d=w.document,a=w.BodyflipLab,backup=await fetch('/state').then(r=>r.json()),checks=[],check=(name,ok)=>{if(!ok)throw Error(name);checks.push(name);},select=(id,value)=>{const e=d.getElementById(id);e.value=value;e.dispatchEvent(new w.Event('change'));};const receipt={passed:false,checks};
 try{
 a.setPlaying(false);select('motion','kinematic');check('Kinematic has zero dynamic bodies',a.state.diagnostics.dynamicBodies===0);a.step(30);let state=a.state,target=a.targetPose();check('Kinematic displays exact target',JSON.stringify(state.pose.points)===JSON.stringify(target.points)&&JSON.stringify(state.pose.q)===JSON.stringify(target.q));check('Kinematic camera follows COM',Math.hypot(...state.cameraCenter.map((x,i)=>x-state.com[i]))<1e-7);
 for(const id of ['resetTarget','motion','runSeconds','loop','snapshot']){const e=d.getElementById(id);e.focus();const down=new w.KeyboardEvent('keydown',{code:'Space',key:' ',bubbles:true,cancelable:true});e.dispatchEvent(down);check('Space owns '+id,down.defaultPrevented&&a.state.playing);const up=new w.KeyboardEvent('keyup',{code:'Space',key:' ',bubbles:true,cancelable:true});e.dispatchEvent(up);check('Space release cancelled '+id,up.defaultPrevented);const repeat=new w.KeyboardEvent('keydown',{code:'Space',repeat:true,bubbles:true,cancelable:true});e.dispatchEvent(repeat);check('Held Space does not retrigger '+id,a.state.playing&&repeat.defaultPrevented);a.setPlaying(false);}
 select('motion','sim');check('Sim restores 25 dynamic bodies',a.state.diagnostics.dynamicBodies===25);a.step(30);check('Modes share same sequence time',Math.abs(a.state.simTime-state.simTime)<1e-8);check('Physics remains distinct',JSON.stringify(a.state.pose.q)!==JSON.stringify(a.targetPose().q));
 const t=performance.now();await a.prepareRun();receipt.cachedResetMs=performance.now()-t;check('Reset reuses decoded NN',receipt.cachedResetMs<1000);
 await a.seek(1.8);check('Asynchronous seek lands at requested time',Math.abs(a.state.simTime-1.8)<1e-8&&!a.state.playing);select('motion','kinematic');a.step(360);check('Kinematic fall remains finite',a.state.diagnostics.finite&&a.state.flight.phase==='FALL LOOP');select('mode','space');a.step(1);check('Kinematic Space works',a.state.diagnostics.finite&&a.state.diagnostics.dynamicBodies===0);select('motion','sim');check('Space restores dynamic limbs',a.state.diagnostics.dynamicBodies===24);check('No runtime errors',a.state.errors.length===0);receipt.passed=true;
 }catch(e){receipt.error=e.stack||String(e);}finally{a.setPlaying(false);await new Promise(r=>setTimeout(r,400));await fetch('/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(backup)});result.textContent=JSON.stringify(receipt,null,2);}
};
</script>
