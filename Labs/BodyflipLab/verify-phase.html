<!doctype html><title>Phase check</title><button id="check">Compare phases</button><pre id="result">Ready</pre><iframe id="lab" src="/" style="width:1100px;height:720px"></iframe><script>
check.onclick=async()=>{const w=lab.contentWindow,d=w.document,a=w.BodyflipLab,backup=await fetch('/state').then(r=>r.json()),checks=[],samples=[],receipt={passed:false,checks,samples};const verify=(name,ok)=>{if(!ok)throw Error(name);checks.push(name);};try{
 a.setPlaying(false);await a.seek(0);
 for(const phase of [0,.44]){const el=d.getElementById('runPhase');el.value=phase;el.dispatchEvent(new w.Event('input',{bubbles:true}));el.dispatchEvent(new w.Event('change',{bubbles:true}));const until=performance.now()+60000;while(a.state.loadingRun&&performance.now()<until)await new Promise(r=>setTimeout(r,50));verify('Phase '+phase+' commits and keeps time',!a.state.loadingRun&&a.state.settings.runPhase===phase&&Math.abs(a.state.simTime-0)<1e-8);const state=a.state;samples.push({phase,points:state.pose.points,root:state.flight.root,foot:state.flight.supportFoot,jumpStart:state.flight.jumpStart});}
 const gap=Math.max(...samples[0].points.map((p,i)=>Math.hypot(...p.map((v,k)=>v-samples[0].root[k]-samples[1].points[i][k]+samples[1].root[k]))));receipt.maxPoseDifference=gap;verify('Phase changes displayed gait at the time zero',gap>.1);verify('No runtime errors',!a.state.errors.length);receipt.passed=true;
 }catch(e){receipt.error=e.stack;}finally{a.setPlaying(false);await new Promise(r=>setTimeout(r,400));await fetch('/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(backup)});result.textContent=JSON.stringify(receipt,null,2);}};
</script>
