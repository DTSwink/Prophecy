<!doctype html><meta charset="utf-8"><title>Bodyflip checks</title><style>body{background:#17202f;color:#eee;font:14px monospace}button{padding:10px}iframe{width:1280px;height:720px;border:0}pre{white-space:pre-wrap}</style><h1>Bodyflip browser checks</h1><button id="run">Run checks</button><pre id="result">Ready</pre><iframe id="lab" src="/"></iframe><script>
document.querySelector('#run').onclick=async()=>{const out=document.querySelector('#result'),w=document.querySelector('#lab').contentWindow,d=w.document,report={checks:[],passed:false},backup=await fetch('/state').then(r=>r.json());out.textContent='Running';
const check=(name,test)=>{if(!test)throw Error(name);report.checks.push(name);},field=(id,value)=>{const e=d.getElementById(id);e.value=value;e.dispatchEvent(new w.Event('input',{bubbles:true}));},click=id=>d.getElementById(id).click();
try{const a=w.BodyflipLab;if(!a)throw Error('Lab not ready');a.setPlaying(false);d.getElementById('mode').value='space';d.getElementById('mode').dispatchEvent(new w.Event('change'));click('reset');field('flipSpeed',120);field('twistSpeed',60);const start=a.state;a.step(60);check('60 ticks: flip 120 deg',Math.abs(a.state.flip-start.flip-120)<1e-8);check('Independent twist 60 deg',Math.abs(a.state.twist-start.twist-60)<1e-8);check('24 actual Jolt joints',a.state.diagnostics.joints===24);check('Knees and elbows are hinges',a.state.diagnostics.hinges.length===4);
for(const b of d.querySelectorAll('[data-axis]')){b.click();a.step(2);check('Axis '+b.textContent,a.state.settings.axis===+b.dataset.axis&&a.state.diagnostics.finite);}
click('zeroTwist');check('Zero twist independent',a.state.twist===0&&a.state.settings.twistSpeed===0&&a.state.settings.flipSpeed===120);
const canvas=d.getElementById('viewport'),capture=canvas.setPointerCapture;canvas.setPointerCapture=()=>{};
try{const initial=[...a.state.settings.target];for(const [type,x,y] of [['pointerdown',600,300],['pointermove',680,260],['pointerup',680,260]])canvas.dispatchEvent(new w.PointerEvent(type,{pointerId:10,button:2,buttons:type==='pointerup'?0:2,clientX:x,clientY:y,bubbles:true}));check('Right-drag target',Math.hypot(...a.state.settings.target.map((v,i)=>v-initial[i]))>.05);
const moved=[...a.state.settings.target];for(const [type,x,y] of [['pointerdown',600,300],['pointermove',600,350],['pointerup',600,350]])canvas.dispatchEvent(new w.PointerEvent(type,{pointerId:10,button:2,buttons:type==='pointerup'?0:2,clientX:x,clientY:y,shiftKey:true,bubbles:true}));check('Shift-right depth',Math.hypot(...a.state.settings.target.map((v,i)=>v-moved[i]))>.05);
const target=[...a.state.settings.target];for(const [type,x,y] of [['pointerdown',600,300],['pointermove',650,320],['pointerup',650,320]])canvas.dispatchEvent(new w.PointerEvent(type,{pointerId:10,button:0,buttons:type==='pointerup'?0:1,clientX:x,clientY:y,bubbles:true}));check('Orbit preserves target',JSON.stringify(target)===JSON.stringify(a.state.settings.target));}finally{canvas.setPointerCapture=capture;}
click('resetTarget');click('cameraReset');field('flipSpeed',0);field('twistSpeed',0);
for(const o of d.getElementById('attack').options){await a.loadAttack(o.value,1);click('strike');a.setPlaying(false);a.step(24);check(o.text+' playback',a.state.attackTime>0&&a.state.diagnostics.finite);}
field('scrub',.3);check('Scrub pauses',Math.abs(a.state.attackTime-.3)<1e-5&&!a.state.playing);click('stopAttack');check('Cancel returns idle',a.state.attackTime===-1);check('No runtime errors',a.state.errors.length===0);
report.passed=true;report.finalDiagnostics=a.state.diagnostics;
}catch(e){report.error=e.message;}finally{w.BodyflipLab?.setPlaying(false);await new Promise(r=>setTimeout(r,400));await fetch('/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(backup)});out.textContent=JSON.stringify(report,null,2);}}
</script>
