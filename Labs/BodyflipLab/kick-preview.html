<!doctype html><html><head><meta charset="utf-8"><title>Bodyflip · Airborne kicks</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#141923;color:#e5eaf2;font:14px system-ui}header{display:flex;align-items:center;gap:24px;padding:14px 22px;border-bottom:1px solid #354158}h1{font-size:20px;margin:0 0 5px}p{margin:0;color:#aebdd2}header label{margin-left:auto;display:flex;align-items:center;gap:10px}select{background:#1b2433;color:inherit;border:1px solid #354158;border-radius:5px;padding:8px;font:inherit}main{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:#354158}section{position:relative;background:#141923}h2{position:absolute;top:16px;left:22px;font-size:16px;margin:0;z-index:1}h2 small{display:block;font-weight:400;font-size:12px;color:#aebdd2;margin-top:5px}canvas{display:block;width:100%;height:calc(100vh - 165px);min-height:300px}footer{display:flex;gap:14px;align-items:center;padding:14px 22px}button{background:#aa91eb;border:0;border-radius:6px;color:#111827;padding:9px 18px;font:inherit;cursor:pointer}input[type=checkbox]{flex:none}header .entry-toggle{margin-left:0}input{flex:1;accent-color:#aa91eb}output{min-width:150px}#status{font-size:12px;color:#aebdd2}a{color:#bbabef}
</style></head><body>
<header><div><h1>Bodyflip · Airborne kicks</h1><p>Full attack motion. Pelvis settles after impact.</p></div><label>Kick <select id="attack" disabled><option value="KickL">Left</option><option value="KickR">Right</option><option value="sweepKick">Sweep kick</option></select></label><label class="entry-toggle" title="Blend directly from the current pose to Armed, then play the recorded strike at native speed."><input id="directArmed" type="checkbox">Direct to Armed</label></header>
<main><section><h2><span id="sourceTitle">Recorded</span><small id="sourceDetail">Full-body motion · COM held for comparison</small></h2><canvas id="recorded"></canvas></section><section><h2>Airborne<small>Kick direction preserved · COM held · no contact</small></h2><canvas id="airborne"></canvas></section></main>
<footer><button id="play">Play</button><input id="time" aria-label="Playback frame" type="range" min="0" max="106" step="1" value="0"><output id="frame"></output><select id="speed" aria-label="Playback speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option></select><span id="status">Loading…</span></footer>
<script src="recovery.js"></script><script src="core.js"></script><script src="torso.js"></script><script src="mass.js"></script><script src="support.js"></script><script src="leg-response.js"></script><script src="attack-inertia.js"></script><script src="airborne-motion.js"></script><script src="kick-attack.js"></script><script src="camera.js"></script><script src="renderer.js"></script>
<script>
'use strict';
const R=Recovery,C=BodyflipCore,K=BodyflipAirborneMotion,{add,sub,mul,dot,cross,length:norm,unit:normalize}=R,clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),posAt=(p,j)=>p.points[j],axisAt=(p,j,k)=>p.axes[j][k],$=id=>document.getElementById(id);
let names,parents,nameToIndex,swordMesh=null,reference,manifest,plan,motion,renderers,ready=false,frame=0,playing=false,stamp=0,nextDraw=0,loadRevision=0;
const cameraState={yaw:-.5,pitch:-.05,zoom:1,panX:0,panY:0},cache=new Map(),storageKey='bodyflip-airborne-kicks-v1';
let saved={};try{saved=JSON.parse(sessionStorage.getItem(storageKey)||'{}');}catch{}
function save(){if(ready)try{sessionStorage.setItem(storageKey,JSON.stringify({attack:$('attack').value,directArmed:$('directArmed').checked,frame,speed:$('speed').value,camera:cameraState}));}catch{}}
function draw(){if(!ready)return;const t=frame/60,poses=[plan.uncorrected(t),plan.sample(t)];for(let i=0;i<2;i++)renderers[i].draw({...poses[i],tint:[.91,.49,.25],bicolor:true,voidScene:true,hideSword:true},plan.center);$('time').value=frame;const source=motion.sourceFrame(t),ph=motion.clip.meta.phases;const label=t<motion.lead?'IN':t>=plan.recoveryEnd?'IDLE':t>motion.end?'RETURN':source<ph.armed?'CHAMBER':source<=ph.hit?'STRIKE':'RETRACT';$('frame').textContent='F '+Math.round(frame)+' · '+label;}
function seek(value){frame=clamp(value,0,Math.ceil(plan.duration*60));draw();save();}
function pause(){playing=false;$('play').textContent='Play';stamp=0;}
function tick(now){if(!playing||document.hidden){stamp=nextDraw=0;return;}if(!stamp)stamp=now;frame=(frame+Math.min(now-stamp,100)*.06*Number($('speed').value))%(plan.duration*60);stamp=now;if(now>=nextDraw){nextDraw=now+1000/30;draw();}requestAnimationFrame(tick);}
function toggle(){if(!ready)return;playing=!playing;$('play').textContent=playing?'Pause':'Play';stamp=0;if(playing)requestAnimationFrame(tick);}
$('play').onclick=toggle;$('time').oninput=e=>{pause();seek(+e.target.value);};$('speed').onchange=save;
document.addEventListener('keydown',e=>{if(e.target.matches('input[type=number],input[type=text],textarea,[contenteditable=true]'))return;if(e.code==='Space'){e.preventDefault();toggle();}else if(ready&&(e.code==='ArrowLeft'||e.code==='ArrowRight')){e.preventDefault();pause();seek(Math.round(frame)+(e.code==='ArrowRight'?1:-1));}},true);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else if(playing)requestAnimationFrame(tick);});window.addEventListener('pagehide',save);
async function load(name){
 const revision=++loadRevision;pause();ready=false;$('status').textContent='Preparing…';$('attack').disabled=true;
 const directArmed=$('directArmed').checked,key=name+':'+directArmed;let entry=cache.get(key);if(!entry){const meta=manifest.clips.find(c=>c.name===name),clip=C.decode(meta,await fetch(meta.file).then(r=>r.arrayBuffer()),names,parents),prepared=BodyflipKickAttack.preview({clip,names,parents,reference,directArmed});prepared.response.sample(prepared.response.duration);entry={track:prepared.track,response:prepared.response};cache.set(key,entry);}
 if(revision!==loadRevision)return;motion=entry.track;plan=entry.response;ready=true;$('sourceTitle').textContent=directArmed?'Direct entry':'Recorded';$('sourceDetail').textContent=directArmed?'Current pose to Armed, then recorded motion':'Full-body motion \u00b7 COM held for comparison';$('attack').disabled=false;$('time').max=Math.ceil(plan.duration*60);frame=clamp(frame,0,+$('time').max);$('status').textContent='Space: play · ← →: frame · Drag: orbit';draw();save();
}
$('attack').onchange=()=>load($('attack').value).catch(fail);
$('directArmed').onchange=()=>load($('attack').value).catch(fail);
function fail(e){$('status').textContent=e.message;console.error(e);}
(async()=>{
 const [m,v]=await Promise.all([fetch('data/manifest.json').then(r=>r.json()),fetch('data/vanilla.json').then(r=>r.json())]);names=m.names;parents=m.parents;nameToIndex=new Map(names.map((n,i)=>[n,i]));reference=C.poseFromShared(m);manifest=v;
 $('directArmed').checked=!!saved.directArmed;if(saved.camera)Object.assign(cameraState,saved.camera);if(['0.25','0.5','1'].includes(saved.speed))$('speed').value=saved.speed;frame=saved.frame||0;
 renderers=['recorded','airborne'].map(id=>{const c=$(id),r=new WebGLMotionRenderer(c,{interactive:false,pixelRatio:1});r.torsoColliders=BodyflipTorso.create(names,parents,reference);let drag=null;c.onpointerdown=e=>{drag=[e.clientX,e.clientY];c.setPointerCapture(e.pointerId);};c.onpointermove=e=>{if(!drag)return;cameraState.yaw-=(e.clientX-drag[0])*.008;cameraState.pitch-=(e.clientY-drag[1])*.006;drag=[e.clientX,e.clientY];draw();};c.onpointerup=c.onpointercancel=()=>{drag=null;save();};c.onwheel=e=>{e.preventDefault();cameraState.zoom*=Math.exp(-e.deltaY*.001);draw();save();};return r;});
 window.onresize=()=>{renderers.forEach(r=>r.rect=r.canvas.getBoundingClientRect());draw();};const requested=new URLSearchParams(location.search).get('attack'),name=['KickL','KickR','sweepKick'].includes(requested)?requested:['KickL','KickR','sweepKick'].includes(saved.attack)?saved.attack:'KickL';$('attack').value=name;await load(name);
})().catch(fail);
</script></body></html>
