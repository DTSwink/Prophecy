<!doctype html><title>Timeline checks</title><button id="run">Check timeline</button><pre id="result">Ready</pre><iframe id="lab" src="/" style="width:1100px;height:720px"></iframe><script>
document.getElementById('run').onclick=async()=>{const w=lab.contentWindow,d=w.document,a=w.BodyflipLab,backup=await fetch('/state').then(r=>r.json()),checks=[],receipt={passed:false,checks},check=(n,v)=>{if(!v)throw Error(n);checks.push(n);},frame=()=>new Promise(r=>w.requestAnimationFrame(()=>w.requestAnimationFrame(r))),key=(id,code)=>d.getElementById(id).dispatchEvent(new w.KeyboardEvent('keydown',{code,bubbles:true,cancelable:true}));try{
 const drag=(id,time)=>{const el=d.getElementById(id),canvasCapture=el.setPointerCapture;el.setPointerCapture=()=>{};const width=d.getElementById('trimControls').getBoundingClientRect().width,max=+el.getAttribute('aria-valuemax'),start=+el.getAttribute('aria-valuenow');try{el.dispatchEvent(new w.PointerEvent('pointerdown',{button:0,pointerId:101,clientX:100,bubbles:true}));el.dispatchEvent(new w.PointerEvent('pointermove',{pointerId:101,clientX:100+(time-start)*width/max,bubbles:true}));el.dispatchEvent(new w.PointerEvent('pointerup',{pointerId:101,bubbles:true}));}finally{el.setPointerCapture=canvasCapture;}};
 a.setPlaying(false);d.getElementById('playbackSpeed').value=1;d.getElementById('playbackSpeed').dispatchEvent(new w.Event('input',{bubbles:true}));check('Footer is one compact row',d.querySelector('footer').getBoundingClientRect().height<=63);check('Trim handles are on the playback rail',d.getElementById('trimIn').parentElement===d.getElementById('trimControls')&&d.getElementById('trimControls').parentElement.className==='timeline-track');check('Separate trim sliders and numbers removed',!d.getElementById('trimInValue')&&d.querySelectorAll('#trimControls input').length===0);
 const scrub=d.getElementById('scrub');await a.seek(a.state.settings.trimIn);scrub.focus();key('scrub','Space');check('Space starts playback with timeline focused',a.state.playing&&d.activeElement===scrub);const before=+scrub.value;await new Promise(r=>setTimeout(r,350));check('Focused timeline advances during playback',+scrub.value>before&&Math.abs(+scrub.value-a.state.simTime)<.12);key('scrub','Space');check('Paused timeline equals displayed frame',!a.state.playing&&Math.abs(+scrub.value-a.state.simTime)<.002);key('scrub','ArrowRight');await frame();check('Focused timeline follows frame stepping',Math.abs(+scrub.value-a.state.simTime)<.002);
 const first=JSON.stringify(a.state.pose.points);d.getElementById('scrub').value=1.25;d.getElementById('scrub').dispatchEvent(new w.Event('input',{bubbles:true}));await frame();check('Input alone updates scene before release',Math.abs(a.state.simTime-1.25)<1e-8&&JSON.stringify(a.state.pose.points)!==first);check('Live scrubbing remains paused',!a.state.playing);
 d.getElementById('scrub').value=.25;d.getElementById('scrub').dispatchEvent(new w.Event('input',{bubbles:true}));d.getElementById('scrub').value=1.4;d.getElementById('scrub').dispatchEvent(new w.Event('input',{bubbles:true}));await frame();check('Latest drag position wins',Math.abs(a.state.simTime-1.4)<1e-8);
 drag('trimIn',.8);await frame();check('Bracket previews during adjustment',Math.abs(a.state.simTime-.8)<1e-8&&Math.abs(a.state.settings.trimIn-.8)<1e-8);drag('trimOut',1.6);await frame();check('Out bracket previews endpoint',Math.abs(a.state.simTime-1.6)<1e-8);check('Bracket positions mark range',parseFloat(d.getElementById('trimIn').style.left)>0&&parseFloat(d.getElementById('trimOut').style.left)>parseFloat(d.getElementById('trimIn').style.left));
 if(!a.state.settings.trimLoop)d.getElementById('trimLoop').click();await a.seek(.8);let wraps=0,last=.8;for(let i=0;i<150;i++){a.playbackStep();let t=a.state.simTime;if(t<.8-1e-8||t>1.6+1e-8)throw Error('Escaped loop');if(t<last)wraps++;last=t;}check('Bracket range loops repeatedly',wraps>=3);check('Editing brackets enables Loop',a.state.settings.trimLoop);d.getElementById('trimLoop').click();await a.seek(.8);let bounded=true;for(let i=0;i<150;i++){a.playbackStep();bounded&&=a.state.simTime>=.8-1e-8&&a.state.simTime<=1.6+1e-8;}check('Loop off still respects brackets',bounded&&Math.abs(a.state.simTime-1.6)<1e-8&&!a.state.playing);d.getElementById('step').click();check('Step cannot escape Out',Math.abs(a.state.simTime-1.6)<1e-8);await a.seek(0);a.setPlaying(true);check('Play below In starts within range even with Loop off',a.state.simTime>=.8-1e-8);a.setPlaying(false);d.getElementById('trimLoop').click();await a.seek(.8);a.setPlaying(true);let liveBounded=true,liveWraps=0,prior=.8;const until=performance.now()+1800;await new Promise(resolve=>{function observe(){const t=a.state.simTime;liveBounded&&=t>=.8-1e-8&&t<=1.6+1e-8;if(t<prior-1e-8)liveWraps++;prior=t;if(performance.now()<until)requestAnimationFrame(observe);else resolve();}requestAnimationFrame(observe);});a.setPlaying(false);check('Real animation playback stays within brackets and repeats',liveBounded&&liveWraps>=1);check('Kinematic stays active',a.state.diagnostics.dynamicBodies===0);check('No runtime errors',a.state.errors.length===0);receipt.passed=true;
 }catch(e){receipt.error=e.stack;}finally{a.setPlaying(false);await new Promise(r=>setTimeout(r,400));await fetch('/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(backup)});result.textContent=JSON.stringify(receipt,null,2);}};
</script>
