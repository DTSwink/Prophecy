<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prophecy — Silent Type variations</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101016;color:#ecebf3}*{box-sizing:border-box}body{margin:0}header{padding:32px 4vw 20px;border-bottom:1px solid #30303c}header small{letter-spacing:.2em;color:#baa4db}h1{font:36px Georgia,serif;margin:10px 0}p{color:#a9a6b6}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:20px;padding:28px 4vw}button{font:inherit;color:inherit;cursor:pointer}article{border:1px solid #34313e;border-radius:8px;overflow:hidden;background:#19181f}article button{padding:0;width:100%;border:0;text-align:left;background:transparent}article button:hover{background:#292334}article img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#070709}article figcaption{padding:14px 16px}b{color:#c4a8ef;margin-right:12px}footer{padding:0 4vw 30px;color:#aaa}a{color:#cbb3f4}dialog{border:1px solid #4b405d;background:#111016;color:#fff;padding:12px;width:96vw;max-width:1800px;max-height:96vh}dialog::backdrop{background:#000d}dialog img{width:100%;height:calc(90vh - 90px);object-fit:contain;display:block}nav{display:flex;align-items:center;gap:12px;padding:6px 0 10px}nav strong{flex:1}nav button{border:1px solid #4b405d;background:#272030;border-radius:5px;padding:8px 16px}nav a{font-size:13px}button:focus-visible,a:focus-visible{outline:2px solid #b98ff3;outline-offset:3px}@media(max-width:450px){main{grid-template-columns:1fr}h1{font-size:28px}nav{flex-wrap:wrap}}
</style>
<header><small>PROPHECY · ART DIRECTION · 23 OCTOBER 2026</small><h1>Silent Type — 10 variations</h1><p>Choose a number. Click to enlarge · Arrow keys browse · Esc closes the preview.</p></header>
<main id="grid"></main>
<footer>Generated concepts for selection, not implemented menus. <a href="manifest.json">Full prompts and provenance</a> · Built-in imagegen.</footer>
<dialog id="viewer"><nav><button id="prev" aria-label="Previous concept">←</button><strong id="caption"></strong><button id="next" aria-label="Next concept">→</button><a id="original" target="_blank">Open original</a><button id="close">Close</button></nav><img id="large" alt=""></dialog>
<script>
const items=[{"id":"01","title":"Pure Editorial","file":"01-pure-editorial.png"},{"id":"02","title":"Fine Underline","file":"02-fine-underline.png"},{"id":"03","title":"Stellar Spine","file":"03-stellar-spine.png"},{"id":"04","title":"Quiet Italic","file":"04-quiet-italic.png"},{"id":"05","title":"Soft Focus","file":"05-soft-focus.png"},{"id":"06","title":"Open Tracking","file":"06-open-tracking.png"},{"id":"07","title":"Double Hairline","file":"07-double-hairline.png"},{"id":"08","title":"Crescent Accent","file":"08-crescent-accent.png"},{"id":"09","title":"Weight and Silence","file":"09-weight-and-silence.png"},{"id":"10","title":"Framed by Air","file":"10-framed-by-air.png"}];
const grid=document.getElementById('grid'), viewer=document.getElementById('viewer'),large=document.getElementById('large'),caption=document.getElementById('caption'),original=document.getElementById('original');
let active=0;
function show(index){active=(index+items.length)%items.length;const item=items[active];large.src=item.file;large.alt=item.id+' — '+item.title;caption.textContent=large.alt;original.href=item.file;if(!viewer.open)viewer.showModal();}
items.forEach((item,i)=>{const card=document.createElement('article');const button=document.createElement('button');const img=document.createElement('img');img.src=item.file;img.alt=item.id+' — '+item.title;img.loading='lazy';const text=document.createElement('figcaption');const number=document.createElement('b');number.textContent=item.id;text.append(number,document.createTextNode(item.title));button.append(img,text);button.onclick=()=>show(i);card.append(button);grid.append(card);});
document.getElementById('prev').onclick=()=>show(active-1);document.getElementById('next').onclick=()=>show(active+1);document.getElementById('close').onclick=()=>viewer.close();
document.addEventListener('keydown',e=>{if(!viewer.open)return;if(e.key==='ArrowRight'){e.preventDefault();show(active+1)}if(e.key==='ArrowLeft'){e.preventDefault();show(active-1)}});
viewer.addEventListener('click',e=>{if(e.target===viewer){const r=viewer.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)viewer.close();}});
</script></html>
