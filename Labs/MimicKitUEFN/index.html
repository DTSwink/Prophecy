<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UEFN · Humanoid overlay</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10151d;color:#e6edf6;font:14px system-ui,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 24px;border-bottom:1px solid #344050}h1{font-size:21px;margin:0 0 4px}small,.muted{color:#a6b5c8}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;height:calc(100vh - 85px)}#view{position:relative;min-width:0;min-height:400px}canvas{display:block;width:100%;height:100%;touch-action:none}aside{padding:20px;border-left:1px solid #344050;overflow:auto;background:#171f2a}label{display:flex;align-items:center;gap:9px;margin:12px 0}.dot{width:10px;height:10px;border-radius:50%;display:inline-block}.new{background:#f59c44}.phat{background:#39dfdd}.old{background:#c3c9d5}input[type=range]{width:100%;accent-color:#f59c44}button,select{font:inherit;background:#253244;color:#e6edf6;border:1px solid #46556a;border-radius:5px;padding:7px 10px;cursor:pointer}select{width:100%;margin-top:8px}button:hover{background:#34465e}.row{display:flex;flex-wrap:wrap;gap:7px}.group{border-top:1px solid #344050;padding-top:15px;margin-top:18px}.line{display:flex;justify-content:space-between;gap:8px}.value{font-variant-numeric:tabular-nums}#detail{line-height:1.6;margin-top:10px;color:#b7c6d8;white-space:pre-line}#hint{position:absolute;bottom:16px;left:20px;pointer-events:none;color:#b7c6d8;font-size:12px}#error{color:#ff9393;padding:18px;white-space:pre-wrap}#angleControls label{justify-content:space-between;margin-bottom:4px}input:disabled{opacity:.3}#status{font-size:12px;line-height:1.5;color:#b7c6d8}a{color:#61d8df}@media(max-width:750px){.layout{height:auto;grid-template-columns:1fr}#view{height:65vh}aside{border-left:0;border-top:1px solid #344050}header{padding:12px}}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head>
<body><header><div><h1>UEFN PHAT / new humanoid</h1><small>15 bodies · 28 action dimensions · 23 PHAT colliders</small></div><button id="rest">Rest pose</button></header>
<div class="layout"><div id="view"><canvas id="canvas" aria-label="Interactive three dimensional collider comparison"></canvas><div id="hint">Drag to orbit · right-drag to pan · wheel to zoom<br>Pose preview only — no physics simulation</div><div id="error" hidden></div></div><aside>
<label><input type="checkbox" id="showPhat" checked><span class="dot phat"></span>UEFN PHAT · wireframe</label>
<label><input type="checkbox" id="showNew" checked><span class="dot new"></span>New model · solid</label>
<label><input type="checkbox" id="showOld"><span class="dot old"></span>Original model · unchanged</label>
<label><input type="checkbox" id="bones">Show skeletons</label>
<div class="line"><span>New model opacity</span><span id="opacityValue">60%</span></div><input id="opacity" type="range" min="0.1" max="1" step=".05" value=".6" aria-label="New model opacity">
<div class="group"><div class="line"><span>Separate models</span><span id="offsetValue">0 cm</span></div><input id="offset" type="range" min="0" max="1.5" step=".01" value="0" aria-label="Separate models"><div class="row"><button id="front">Front</button><button id="side">Side</button><button id="perspective">Perspective</button></div></div>
<div class="group"><label for="body">Inspect body / joint</label><select id="body"><option value="">All bodies</option></select><label><input type="checkbox" id="isolate">Isolate selected colliders</label><div id="detail"></div><div id="angleControls" hidden></div><button id="jointReset" hidden>Reset this joint</button></div>
<div class="group" id="status">Loading verified geometry…</div>
</aside></div><script type="module" src="overlay.js"></script></body></html>
