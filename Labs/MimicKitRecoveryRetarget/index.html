<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recovery · 15-body motion review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10151d;color:#e1eaf5;font:14px system-ui}header,nav,footer{padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}header{border-bottom:1px solid #344253}h1{font-size:20px;margin:0}small{color:#a9bbcf}button,select{background:#1c2b3b;border:1px solid #4a6076;border-radius:5px;color:inherit;padding:8px;cursor:pointer}#view{height:calc(100vh - 220px);min-height:320px;position:relative}canvas{display:block;width:100%;height:100%;touch-action:none}#info{position:absolute;left:20px;top:12px;white-space:pre-line;font:13px ui-monospace,monospace;pointer-events:none;background:#10151dc9;padding:8px}#timeline{flex:1;min-width:180px;accent-color:#f0a44c}#error{color:#ff8f8f;white-space:pre-wrap}label{white-space:nowrap}.source{color:#45d9e1}.reduced{color:#f8ab55}

<header><h1>Recovery · 15-body motion review</h1><small>Candidate retarget · kinematic playback · no training launched</small></header>
<nav><select id="clip" aria-label="Motion"></select><span class="source">Original FBX</span><span class="reduced">15-body retarget</span><label><input type="checkbox" id="overlay"> Overlay</label><label><input type="checkbox" id="source" checked> Original</label><label><input type="checkbox" id="reduced" checked> Retarget</label><button id="camera">Reset camera</button></nav>
<nav style="padding-top:0"><label title="Preserve recorded movement against the stationary floor. You can still orbit the camera."><input type="checkbox" id="fixedCamera" checked> Fixed camera · foot sliding</label><label><input type="checkbox" id="spheres"> Hand / head / foot spheres</label><label>Radius <input id="sphereRadius" aria-label="Sphere radius in cm" type="number" min="0" step="1" value="30" style="width:76px;background:#1c2b3b;color:inherit;border:1px solid #4a6076;padding:6px;border-radius:5px"> cm</label></nav>
