<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Imperial spear · reference comparison</title>
<style>
:root{color-scheme:dark;font:15px/1.45 system-ui;background:#101113;color:#e7e8e9}body{margin:0;padding:24px}header{max-width:1700px;margin:auto;display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap}h1{font-size:20px;margin:0;font-weight:600}p{margin:5px 0 0;color:#b4b6ba;font-size:13px}.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}button,select{font:inherit;color:inherit;background:#25272c;border:1px solid #45484e;border-radius:6px;padding:7px 11px;cursor:pointer}button:hover{background:#363a42}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:1700px;margin:24px auto}figure{margin:0;min-width:0}figcaption{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#c3c6cc;margin-bottom:8px}.stage{position:relative;overflow:hidden;background:#000;aspect-ratio:1200/673;border:1px solid #34363c;border-radius:5px}.stage img{position:absolute;max-width:none;width:100%;height:auto;left:0;top:0}.overlay{max-width:1200px;margin:24px auto;display:none}.overlay .stage{width:100%}label{display:flex;gap:9px;align-items:center;color:#c5c7cc}input{accent-color:#c8a566}.foot{max-width:1700px;margin:auto;font-size:12px;color:#92969e}a{color:#d5b67d}@media(max-width:800px){body{padding:14px}.pair{gap:10px}.tools{font-size:13px}}
</style>
<header><div><h1>Imperial spear · reference comparison</h1><p>Matched tip, shaft axis and image scale. Work in progress.</p></div><div class="tools">
<select id="crop" aria-label="Comparison area"><option value="head">Whole head</option><option value="gold" selected>Gold assembly</option><option value="wood">Wood and cuff</option><option value="blade">Blade surface</option></select>
<button id="mode">Overlay</button><button id="reload">Refresh images</button><label id="fadeLabel" hidden>Candidate <input id="fade" type="range" min="0" max="100" value="50"></label></div></header>
<main class="pair" id="pair"><figure><figcaption>Reference</figcaption><div class="stage"><img src="References/Reference_Target.png" alt="User's reference spear"></div></figure><figure><figcaption>Current working model</figcaption><div class="stage"><img class="candidate" src="Comparison_Current.png" alt="Current model rendered in the reference pose"></div></figure></main>
<main class="overlay" id="overlay"><div class="stage"><img src="References/Reference_Target.png" alt="Reference"><img class="candidate blend" src="Comparison_Current.png" alt="Current model overlay" style="opacity:.5"></div></main>
<p class="foot">The requested forward grip and blunt pommel are intentional variations. <a href="Comparison_Before.png">Before rebuild, same camera</a> · <a href="Comparison_Current.png">Current full render</a> · <a href="Comparison_GoldOblique.png">Gold bevels, oblique</a> · <a href="Comparison_WoodDetail.png">Wood close view</a> · <a href="Comparison_DetailMacro.png">Assembly close view</a></p>
<script>
const crops={head:[0,0,1200,673],gold:[450,205,475,255],wood:[690,395,420,260],blade:[185,25,345,245]};
function crop(){let [x,y,w,h]=crops[document.querySelector('#crop').value];document.querySelectorAll('.stage').forEach(el=>{el.style.aspectRatio=w+'/'+h;el.querySelectorAll('img').forEach(img=>{img.style.width=1200/w*100+'%';img.style.left=-x/w*100+'%';img.style.top=-y/h*100+'%';});});}
document.querySelector('#crop').onchange=crop;crop();
let overlay=false;document.querySelector('#mode').onclick=()=>{overlay=!overlay;document.querySelector('#pair').style.display=overlay?'none':'grid';document.querySelector('#overlay').style.display=overlay?'block':'none';document.querySelector('#mode').textContent=overlay?'Side by side':'Overlay';document.querySelector('#fadeLabel').hidden=!overlay;};
document.querySelector('#fade').oninput=e=>document.querySelector('.blend').style.opacity=e.target.value/100;
document.querySelector('#reload').onclick=()=>document.querySelectorAll('.candidate').forEach(img=>img.src='Comparison_Current.png?t='+Date.now());
</script></html>
