<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Bodyflip · Unreal motion review</title>
<style>
*{box-sizing:border-box}body{height:100dvh;display:flex;flex-direction:column;margin:0;background:#131922;color:#e5eaf2;font:14px system-ui}header,footer{padding:13px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:#1c2533}h1{font-size:17px;margin:0}label{display:flex;align-items:center;gap:8px}button,select{background:#29374a;border:1px solid #455570;color:#eef1ff;border-radius:5px;padding:7px 10px}button{cursor:pointer}input{accent-color:#b49aff}#view{flex:1;min-height:180px;position:relative}header,footer,#info{flex-shrink:0}canvas{width:100%;height:100%;display:block;touch-action:none}#legend{position:absolute;left:20px;top:15px;color:#b5c1d4;pointer-events:none;line-height:1.8}#readout{position:absolute;right:20px;top:15px;background:#1c2533dd;border:1px solid #344259;padding:12px;min-width:230px;pointer-events:none}#time{flex:1;min-width:200px}#info{padding:9px 20px;color:#a9b7ca;font-size:12px}#case{max-width:300px}#info{max-height:100px;overflow:auto}#error{color:#ffb5b5}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}#clock{min-width:125px;font-variant-numeric:tabular-nums}
</style>
<header><h1>Motion review</h1><label>Recording <select id="case"><option>Floor present</option><option>Floor lowered 1.2 m</option></select></label><label>Target pose <select id="overlay"><option value="ghost">Overlay</option><option value="off">Hidden</option><option value="only">Target only</option></select></label><label>Inspect <select id="bone"></select></label><button id="worst">Jump to flagged moment</button></header>
<main id="view"><canvas id="canvas"></canvas><div id="legend"><span class="dot" style="background:#ed853f"></span>Simulated body · cyan left side<br><span class="dot" style="background:#bb8fff"></span>Requested pose<br>Drag: orbit · Right-drag: pan · Wheel: zoom</div><div id="readout">Loading recording…</div></main>
<footer><button id="play">Pause</button><button id="previous" aria-label="Previous frame">◀</button><button id="next" aria-label="Next frame">▶</button><input id="time" aria-label="Recorded frame" type="range" min="0" value="0" step="1"><span id="clock"></span><label>Speed <select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option></select></label><button id="front">Front</button><button id="side">Side</button><button id="reset">Reset view</button><label><input id="follow" type="checkbox" checked>Follow body</label></footer>
<div id="info">Recorded Unreal physics, 60 frames/s. Target overlay uses the same world coordinates. No motion smoothing or fresh simulation. <span id="error"></span></div>
<script type="module">
import * as THREE from '/Labs/MimicKitUEFN/vendor/three.module.js';
const $=id=>document.getElementById(id), scene=new THREE.Scene(), renderer=new THREE.WebGLRenderer({canvas:$('canvas'),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0x131922);
const camera=new THREE.PerspectiveCamera(42,1,.5,10000);camera.up.set(0,0,1);
scene.add(new THREE.HemisphereLight(0xe5f1ff,0x263142,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(200,-300,500);scene.add(light);
let recordings,current,index=0,playing=true,clock=0,last=0,items=[],floorGroup,actualAxes,targetAxes;
let yaw=-1.0,pitch=.3,distance=350,centre=new THREE.Vector3(0,0,0),followPoint=new THREE.Vector3(),drag=null;
const targetMat=new THREE.MeshBasicMaterial({color:0xb68cff,transparent:true,opacity:.12,depthWrite:false,depthTest:false,side:THREE.DoubleSide});
function updateCamera(){camera.position.set(centre.x+distance*Math.cos(pitch)*Math.cos(yaw),centre.y+distance*Math.cos(pitch)*Math.sin(yaw),centre.z+distance*Math.sin(pitch));camera.lookAt(centre);}
function resetCamera(){const f=current.frames[index],p=f.actual.points[current.names.indexOf('pelvis')];centre.fromArray(p);followPoint.fromArray(p);yaw=-1;pitch=.3;distance=350;updateCamera();}
function setPlaying(value){playing=value;last=0;$('play').textContent=playing?'Pause':'Play';}
function seek(i){index=Math.max(0,Math.min(current.frames.length-1,i));clock=current.frames[index].time;draw();}
function build(n){
 current=recordings.cases[n];$('case').value=String(n);for(const item of items){scene.remove(item.actual,item.target);item.actual.geometry.dispose();item.actual.material.dispose();}items=[];
 if(floorGroup){scene.remove(floorGroup);floorGroup.traverse(x=>{x.geometry?.dispose();x.material?.dispose();});}
 for(const shape of current.geometry){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(shape.vertices.flat(),3));g.setIndex(shape.faces.flat());g.computeVertexNormals();const actual=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:shape.color??(shape.name.endsWith('_l')?0x20bdcf:0xe98947),roughness:.75})),target=new THREE.Mesh(g,targetMat);target.renderOrder=2;scene.add(actual,target);items.push({actual,target,bone:shape.bone});}
 floorGroup=new THREE.Group();const floor=current.floor,box=new THREE.Mesh(new THREE.BoxGeometry(...floor.scale.map(v=>100*v)),new THREE.MeshStandardMaterial({color:0x253347,transparent:true,opacity:.65}));box.position.fromArray(floor.p);box.quaternion.fromArray(floor.q);floorGroup.add(box);
 const grid=new THREE.GridHelper(2000,40,0x627791,0x35465d);grid.rotation.x=Math.PI/2;grid.position.set(floor.p[0],floor.p[1],floor.p[2]+floor.scale[2]*50+.15);grid.quaternion.fromArray(floor.q).multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0),Math.PI/2));grid.position.fromArray(floor.p).add(new THREE.Vector3(0,0,floor.scale[2]*50+.15).applyQuaternion(new THREE.Quaternion().fromArray(floor.q)));floorGroup.add(grid);floorGroup.visible=!current.noFloor;scene.add(floorGroup);
 if(!actualAxes){actualAxes=new THREE.AxesHelper(25);targetAxes=new THREE.AxesHelper(32);targetAxes.material.depthTest=false;targetAxes.renderOrder=3;scene.add(actualAxes,targetAxes);}
 $('bone').replaceChildren(...current.names.filter(n=>current.geometry.some(g=>g.name===n)).map(n=>new Option(n.replaceAll('_',' '),n)));$('bone').value=current.focusBone||'foot_r';$('overlay').disabled=current.hasReference===false;$('info').textContent=current.note||'Recorded Unreal physics, 60 frames/s. Purple is the requested pose in the same world coordinates.';$('legend').innerHTML='<span class=dot style=background:#ed853f></span>'+(current.actualLabel||'Simulated body · cyan left side')+'<br><span class=dot style=background:#bb8fff></span>'+(current.hasReference===false?'No separate reference pose':current.targetLabel||'Requested pose')+'<br>Drag: orbit · Right-drag: pan · Wheel: zoom';$('time').max=current.frames.length-1;index=Math.min(index,current.frames.length-1);clock=current.frames[index].time;last=0;resetCamera();draw();
}
function draw(){if(!current)return;const f=current.frames[index],overlay=current.hasReference===false?'off':$('overlay').value,bone=current.names.indexOf($('bone').value),row=f.errors.find(r=>r.name===$('bone').value);
 const nextFollow=new THREE.Vector3().fromArray(f.actual.points[current.names.indexOf('pelvis')]);if($('follow').checked)centre.add(nextFollow.clone().sub(followPoint));followPoint.copy(nextFollow);updateCamera();
 for(const item of items){for(const kind of ['actual','target']){const mesh=item[kind],p=f[kind];if(!p){mesh.visible=false;continue;}mesh.position.fromArray(p.points[item.bone]);mesh.quaternion.fromArray(p.q[item.bone]);mesh.visible=kind==='actual'?overlay!=='only':overlay!=='off';}item.actual.material.emissive.setHex(item.bone===bone?0x35200c:0);}
 actualAxes.position.fromArray(f.actual.points[bone]);actualAxes.quaternion.fromArray(f.actual.q[bone]);actualAxes.visible=overlay!=='only';if(f.target){targetAxes.position.fromArray(f.target.points[bone]);targetAxes.quaternion.fromArray(f.target.q[bone]);}targetAxes.visible=!!f.target&&overlay!=='off';
 $('time').value=index;$('clock').textContent=`F ${Math.round(f.time*60)} · ${f.time.toFixed(3)} s`;$('readout').innerHTML=`<b>${$('bone').selectedOptions[0].text}</b><br>Angle difference: <b>${row?(row.angleRad*180/Math.PI).toFixed(1):'—'}°</b><br>Position difference: ${row?row.errorCm.toFixed(2):'—'} cm<br>${row?.lengthErrorCm!==undefined?`Segment length difference: ${row.lengthErrorCm.toFixed(2)} cm`:current.hasReference===false?'No reference-pose error defined':''}`;
 targetMat.opacity=overlay==='only'?.85:.12;renderer.render(scene,camera);
}
function tick(now){requestAnimationFrame(tick);if(!current)return;if(playing&&!document.hidden){if(last){clock+=(now-last)/1000*Number($('speed').value);const end=current.frames.at(-1).time;if(clock>end+.35)clock=current.frames[0].time;let next=index;while(next+1<current.frames.length&&current.frames[next+1].time<=clock+1e-6)next++;if(clock<current.frames[index].time)next=0;index=next;}}last=now;draw();}
$('play').onclick=()=>setPlaying(!playing);$('time').oninput=()=>{setPlaying(false);seek(Number($('time').value));};
const step=d=>{setPlaying(false);seek(index+d);};$('previous').onclick=()=>step(-1);$('next').onclick=()=>step(1);
$('case').onchange=()=>build($('case').selectedIndex);$('overlay').onchange=$('bone').onchange=draw;
$('worst').onclick=()=>{setPlaying(false);$('bone').value=current.focusBone||current.worst.bone;const i=current.focusTime===undefined?current.worst.frame:current.frames.reduce((best,f,n)=>Math.abs(f.time-current.focusTime)<Math.abs(current.frames[best].time-current.focusTime)?n:best,0);seek(i);};
$('front').onclick=()=>{yaw=-Math.PI/2;pitch=.05;updateCamera();draw();};$('side').onclick=()=>{yaw=0;pitch=.05;updateCamera();draw();};$('reset').onclick=()=>{resetCamera();draw();};
const canvas=$('canvas');canvas.oncontextmenu=e=>e.preventDefault();canvas.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,pan:e.button===2};canvas.setPointerCapture(e.pointerId);};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;
canvas.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(drag.pan){const right=new THREE.Vector3().setFromMatrixColumn(camera.matrix,0),up=new THREE.Vector3().setFromMatrixColumn(camera.matrix,1);centre.addScaledVector(right,-dx*distance*.001).addScaledVector(up,dy*distance*.001);}else{yaw-=dx*.008;pitch=Math.max(-1.45,Math.min(1.45,pitch+dy*.006));}drag.x=e.clientX;drag.y=e.clientY;updateCamera();draw();};
canvas.onwheel=e=>{e.preventDefault();distance=Math.max(60,Math.min(4000,distance*Math.exp(e.deltaY*.001)));updateCamera();draw();};
document.onkeydown=e=>{if(e.target.matches('select,input,button'))return;if(e.code==='Space'){e.preventDefault();setPlaying(!playing);}else if(e.code==='ArrowRight'||e.code==='ArrowLeft'){e.preventDefault();step(e.code==='ArrowRight'?1:-1);}};
document.addEventListener('visibilitychange',()=>last=0);
new ResizeObserver(()=>{const r=$('view').getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix();draw();}).observe($('view'));
try{const response=await fetch('/Saved/Diagnostics/BodyflipFloorReview20261103/replay.json');if(!response.ok)throw Error(`Recording: HTTP ${response.status}`);recordings=await response.json();$('case').replaceChildren(...recordings.cases.map((c,i)=>new Option(c.label,String(i))));build(Number(new URLSearchParams(location.search).get('case')||0));requestAnimationFrame(tick);}catch(e){$('info').textContent=e.message;$('readout').textContent='Could not load recording';console.error(e);}
</script></html>
